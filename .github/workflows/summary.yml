name: Summary CI

on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-summary
  cancel-in-progress: false

jobs:
  release:
    name: Generate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Update summary in README
        uses: upptime/uptime-monitor@v1.46.3
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
